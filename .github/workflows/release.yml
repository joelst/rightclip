name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify release tag and version
        shell: pwsh
        env:
          FFMPEG_REDISTRIBUTION_APPROVED: ${{ vars.FFMPEG_REDISTRIBUTION_APPROVED }}
        run: |
          if ($env:FFMPEG_REDISTRIBUTION_APPROVED -ne 'true') {
            throw 'Complete the static FFmpeg dependency/source license audit before enabling binary releases. See docs/RELEASING.md.'
          }
          if ($env:GITHUB_REF_TYPE -ne 'tag') { throw 'Release must run against a version tag.' }
          [xml]$properties = Get-Content .\Directory.Build.props -Raw
          $version = $properties.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$($version)") {
            throw "Release tag must match project version v$($version)."
          }

      - name: Verify Azure OIDC subject
        shell: pwsh
        run: |
          $expectedSubject = "repo:$($env:GITHUB_REPOSITORY):environment:release"
          $requestUrl = "$($env:ACTIONS_ID_TOKEN_REQUEST_URL)&audience=api://AzureADTokenExchange"
          $response = Invoke-RestMethod -Headers @{ Authorization = "Bearer $($env:ACTIONS_ID_TOKEN_REQUEST_TOKEN)" } -Uri $requestUrl
          $payload = $response.value.Split('.')[1].Replace('-', '+').Replace('_', '/')
          $payload += '=' * ((4 - $payload.Length % 4) % 4)
          $claims = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($payload)) | ConvertFrom-Json
          Write-Output "OIDC subject: $($claims.sub)"
          if ($claims.sub -ne $expectedSubject) {
            throw "Expected '$expectedSubject' but received '$($claims.sub)'."
          }

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Azure login for signing
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Artifact Signing module
        shell: pwsh
        run: Install-Module -Name ArtifactSigning -RequiredVersion 0.1.8 -Scope CurrentUser -Force -Repository PSGallery

      - name: Verify Azure Trusted Signing
        shell: pwsh
        env:
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER: ${{ vars.AZURE_TRUSTED_SIGNING_PUBLISHER }}
        run: |
          foreach ($name in 'AZURE_TRUSTED_SIGNING_ENDPOINT', 'AZURE_TRUSTED_SIGNING_ACCOUNT_NAME', 'AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME', 'AZURE_TRUSTED_SIGNING_PUBLISHER') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing release configuration: $($name)"
            }
          }
          $probe = Join-Path $env:RUNNER_TEMP 'rightclip-signing-probe.exe'
          Copy-Item (Join-Path $PSHOME 'pwsh.exe') $probe -Force
          & pwsh -NoLogo -NoProfile -File .\eng\Invoke-AzureTrustedSigning.ps1 -FilePath $probe
          if ($LASTEXITCODE -ne 0) {
            throw "Azure signing preflight failed with exit code $($LASTEXITCODE)."
          }

      - name: Acquire verified FFmpeg tools
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -File .\eng\Get-FFmpeg.ps1
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg verification failed.' }

      - name: Build and test
        shell: pwsh
        run: |
          $env:RIGHTCLIP_TEST_FFMPEG_DIR = (Resolve-Path .\third_party\ffmpeg\tools).Path
          dotnet build RightClip.sln -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          dotnet test RightClip.sln -c Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish and sign release
        shell: pwsh
        env:
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER: ${{ vars.AZURE_TRUSTED_SIGNING_PUBLISHER }}
        run: |
          pwsh -NoLogo -NoProfile -File .\eng\Publish-RightClip.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Release packaging failed.' }

      - name: Verify packaged app and installer
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -File .\eng\Test-Installer.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Installer smoke tests failed.' }

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RightClip-${{ github.ref_name }}
          path: |
            dist/RightClip-*-Setup.exe
            dist/RightClip-*.zip
          if-no-files-found: error

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/RightClip-*-Setup.exe
            dist/RightClip-*.zip
